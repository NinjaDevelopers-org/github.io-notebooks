openapi: 3.0.0
info:
  title: Scalar Integration API
  description: This is the API documentation for the Scalar Integration using GitBook.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Main (production) server
  - url: https://staging-api.example.com/v1
    description: Staging server
paths:
  /scalars:
    get:
      summary: List all scalars
      description: Retrieve a list of all scalars.
      responses:
        '200':
          description: A JSON array of scalars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scalar'
    post:
      summary: Create a new scalar
      description: Create a new scalar with the provided details.
      requestBody:
        description: Scalar object that needs to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scalar'
      responses:
        '201':
          description: Scalar created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scalar'
  /scalars/{scalarId}:
    get:
      summary: Get a scalar by ID
      description: Retrieve a scalar by its ID.
      parameters:
        - name: scalarId
          in: path
          required: true
          description: ID of the scalar to retrieve
          schema:
            type: string
      responses:
        '200':
          description: A scalar object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scalar'
        '404':
          description: Scalar not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a scalar by ID
      description: Update the details of a scalar by its ID.
      parameters:
        - name: scalarId
          in: path
          required: true
          description: ID of the scalar to update
          schema:
            type: string
      requestBody:
        description: Scalar object with updated details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scalar'
      responses:
        '200':
          description: Scalar updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scalar'
        '404':
          description: Scalar not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a scalar by ID
      description: Delete a scalar by its ID.
      parameters:
        - name: scalarId
          in: path
          required: true
          description: ID of the scalar to delete
          schema:
            type: string
      responses:
        '204':
          description: Scalar deleted successfully
        '404':
          description: Scalar not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
/**
 * @prettier
 */

/** Dev Note:
 * StatsWriterPlugin is disabled by default; uncomment to enable
 * when enabled, rebuilding the bundle will cause error for assetSizeLimit,
 * which we want to keep out of CI/CD
 * post build, cli command: npx webpack-bundle-analyzer <path>
 */

const { DuplicatesPlugin } = require("inspectpack/plugin")
const {const ui = SwaggerUIBundle({
  url: "https://raw.githubusercontent.com/NinjaDevelopers-org/github.io-notebooks/main/openapi.yaml",
  dom_id: '#swagger-ui',
  presets: [
    SwaggerUIBundle.presets.apis,
    SwaggerUIStandalonePreset
  ],
  layout: "StandaloneLayout"
});
  WebpackBundleSizeAnalyzerPlugin,
} = require("webpack-bundle-size-analyzer")
const configBuilder = require("./_config-builder")

// import path from "path"
// import { StatsWriterPlugin } from "webpack-stats-plugin"

const result = configBuilder(
  {
    minimize: true,
    mangle: true,
    sourcemaps: false,
    includeDependencies: true,
  },
  {
    entry: {
      "swagger-ui-bundle": ["./src/index.js"],
    },
    output: {
      globalObject: "this",
      library: {
        name: "SwaggerUIBundle",
        export: "default",
      },
    },
    plugins: [
      new DuplicatesPlugin({
        // emit compilation warning or error? (Default: `false`)
        emitErrors: false,
        // display full duplicates information? (Default: `false`)
        verbose: false,
      }),
      new WebpackBundleSizeAnalyzerPlugin("log.bundle-sizes.swagger-ui.txt"),
      // new StatsWriterPlugin({
      //   filename: path.join("log.bundle-stats.swagger-ui.json"),
      //   fields: null,
      // }),
    ],
  }
)

module.exports = result
  schemas:
    Scalar:
      type: object
      properties:
        id:
          type: string
          description: The scalar ID
        name:
          type: string
          description: The scalar name
        value:
          type: number
          description: The scalar value
      required:
        - id
        - name
        - value
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
